name: COSMO CI

on:
  # PR branches are validated by the pull_request event. Restrict push CI to
  # main so each PR commit does not consume a second, duplicate workflow run.
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer commit to the same PR supersedes the older validation run. This keeps
# CI focused on the head that can actually be merged while preserving main runs.
concurrency:
  group: cosmo-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  TZ: UTC
  PYTHONHASHSEED: "0"

jobs:
  lean:
    name: Lean 4 formal integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # COSMO's current integrity checks do not depend on Git history.
          # Keep the checkout shallow unless a future provenance check requires
          # the QEC-style fetch-depth: 0 contract explicitly.
          fetch-depth: 1

      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build pinned Lake project
        run: lake build

      - name: Reject sorry and custom axioms
        run: ./scripts/check-lean-trust.sh

      - name: Print theorem axiom dependencies
        run: |
          lake env lean audit/AxiomAudit.lean | tee axiom-report.txt
          if grep -q 'sorryAx' axiom-report.txt; then
            echo 'ERROR: sorryAx detected in exported theorem dependencies.' >&2
            exit 1
          fi

  python:
    name: Python deterministic core
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development checks
        run: python -m pip install -r requirements-dev.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Static type check
        run: mypy --strict cosmovirus.py tests/test_cosmovirus.py

      - name: Bytecode compile check
        run: python -m compileall -q cosmovirus.py tests
