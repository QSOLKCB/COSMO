name: COSMO CI

on:
  # PR branches are validated by the pull_request event. Restrict push CI to
  # main so each PR commit does not consume a second, duplicate workflow run.
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer commit to the same PR supersedes the older validation run. This keeps
# CI focused on the head that can actually be merged while preserving main runs.
concurrency:
  group: cosmo-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  TZ: UTC
  PYTHONHASHSEED: "0"

jobs:
  lean:
    name: Lean 4 formal integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # COSMO's current integrity checks do not depend on Git history.
          # Keep the checkout shallow unless a future provenance check requires
          # the QEC-style fetch-depth: 0 contract explicitly.
          fetch-depth: 1

      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Port the bounded-parallelism policy used by QSOL-GEO-REASON. Hosted
      # runners vary in CPU count, so cap at four rather than oversubscribing.
      - name: Configure bounded Lean parallelism
        shell: bash
        run: |
          set -euo pipefail
          cpus="$(nproc)"
          workers="$cpus"
          if [ "$workers" -gt 4 ]; then workers=4; fi
          if [ "$workers" -lt 1 ]; then workers=1; fi
          echo "LEAN_NUM_THREADS=${workers}" >> "$GITHUB_ENV"
          echo "Lean will use ${workers} thread(s) on ${cpus} runner CPU(s)."

      # The dependency declaration pins Mathlib by exact commit, so this cache
      # identity changes whenever the Lean toolchain or dependency declaration
      # changes. A compatible older key can still supply the same dependency
      # graph when an unrelated Lake target setting changes.
      - name: Restore Lean dependency/build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/packages
            lake-manifest.json
          key: cosmo-lean-deps-v1-${{ runner.os }}-lean-4.33.1-${{ hashFiles('lean-toolchain', 'lakefile.lean') }}
          restore-keys: |
            cosmo-lean-deps-v1-${{ runner.os }}-lean-4.33.1-

      - name: Reject admitted proofs, custom declarations, and native_decide lexically
        run: ./scripts/check-lean-trust.sh

      - name: Build pinned Lake project
        run: lake build

      - name: Verify build did not mutate tracked trust inputs
        run: git diff --exit-code HEAD --

      - name: Replay package declarations through the Lean kernel
        shell: bash
        run: |
          set -euo pipefail
          build_dir=".lake/build/lib/lean"
          modules=()
          while IFS= read -r -d '' olean; do
            module="${olean#"$build_dir/"}"
            module="${module%.olean}"
            modules+=("${module//\//.}")
          done < <(find "$build_dir" -type f -name '*.olean' -print0 | sort -z)
          if [ "${#modules[@]}" -eq 0 ]; then
            echo "ERROR: no project modules found for kernel replay."
            exit 1
          fi
          lake env leanchecker "${modules[@]}"

      - name: Compile clean semantic auditor
        shell: bash
        run: |
          set -euo pipefail
          audit_dir="$RUNNER_TEMP/cosmo-trust-audit"
          rm -rf "$audit_dir"
          mkdir -p "$audit_dir"
          sed 's/namespace CosmoTrust/namespace CosmoTrustCI/; s/end CosmoTrust/end CosmoTrustCI/' \
            CosmoTrust.lean > "$audit_dir/CosmoTrustCI.lean"
          {
            echo 'import CosmoTrustCI'
            sed 's/CosmoTrust\./CosmoTrustCI./g' audit/AxiomAudit.lean
          } > "$audit_dir/AxiomAuditCI.lean"
          lake env lean -o .lake/build/lib/lean/CosmoTrustCI.olean \
            "$audit_dir/CosmoTrustCI.lean"

      - name: Audit every COSMO declaration semantically
        shell: bash
        run: |
          lake env lean "$RUNNER_TEMP/cosmo-trust-audit/AxiomAuditCI.lean" \
            | tee axiom-report.txt

      - name: Regression-test generated axiom rejection
        shell: bash
        run: |
          set -euo pipefail
          temporary="$(mktemp -d)"
          fixture="$temporary/GeneratedAxiomFixture.lean"
          report="$temporary/generated-axiom-report.txt"
          trap 'rm -rf "$temporary"' EXIT

          cat > "$fixture" <<'LEAN'
          import CosmoTrustCI

          open Lean Elab Command

          run_cmd do
            liftCoreM <| addDecl <| Declaration.axiomDecl {
              name := `CosmoTrustFixture.generatedBogus
              levelParams := []
              type := mkConst ``False
              isUnsafe := false
            }

          run_cmd do
            CosmoTrustCI.auditNamedDeclarations
              "generated declaration regression fixture"
              #[`CosmoTrustFixture.generatedBogus]
          LEAN

          if lake env lean "$fixture" >"$report" 2>&1; then
            cat "$report"
            echo "ERROR: semantic trust audit accepted a generated axiom declaration."
            exit 1
          fi

          cat "$report"
          grep -F "project-generated axiom declaration" "$report" >/dev/null

      - name: Regression-test unchecked theorem rejection
        shell: bash
        run: |
          set -euo pipefail
          temporary="$(mktemp -d)"
          fixture="$temporary/GeneratedUncheckedTheorem.lean"
          olean=".lake/build/lib/lean/GeneratedUncheckedTheorem.olean"
          report="$temporary/unchecked-theorem-report.txt"
          trap 'rm -rf "$temporary"; rm -f "$olean"' EXIT

          cat > "$fixture" <<'LEAN'
          import Lean.Elab.Command

          open Lean Elab Command

          set_option debug.skipKernelTC true in
          run_cmd do
            liftCoreM <| addDecl (forceExpose := true) <| Declaration.thmDecl {
              name := `GeneratedUncheckedTheorem.bogus
              levelParams := []
              type := mkConst ``False
              value := mkConst ``True.intro
            }
          LEAN

          lake env lean -o "$olean" "$fixture"
          if lake env leanchecker GeneratedUncheckedTheorem >"$report" 2>&1; then
            cat "$report"
            echo "ERROR: kernel replay accepted an unchecked malformed theorem."
            exit 1
          fi

          cat "$report"
          grep -F "leanchecker found a problem in GeneratedUncheckedTheorem" \
            "$report" >/dev/null

  python:
    name: Python deterministic core
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development checks
        run: python -m pip install -r requirements-dev.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Static type check
        run: mypy --strict cosmovirus.py tests/test_cosmovirus.py

      - name: Bytecode compile check
        run: python -m compileall -q cosmovirus.py tests
