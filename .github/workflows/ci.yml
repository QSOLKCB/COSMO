name: COSMO CI

on:
  # PR branches are validated by the pull_request event. Restrict push CI to
  # main so each PR commit does not consume a second, duplicate workflow run.
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer commit to the same PR supersedes the older validation run. This keeps
# CI focused on the head that can actually be merged while preserving main runs.
concurrency:
  group: cosmo-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  TZ: UTC
  PYTHONHASHSEED: "0"

jobs:
  lean:
    name: Lean 4 formal integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # COSMO's current integrity checks do not depend on Git history.
          # Keep the checkout shallow unless a future provenance check requires
          # the QEC-style fetch-depth: 0 contract explicitly.
          fetch-depth: 1

      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Port the bounded-parallelism policy used by QSOL-GEO-REASON. Hosted
      # runners vary in CPU count, so cap at four rather than oversubscribing.
      - name: Configure bounded Lean parallelism
        shell: bash
        run: |
          set -euo pipefail
          cpus="$(nproc)"
          workers="$cpus"
          if [ "$workers" -gt 4 ]; then workers=4; fi
          if [ "$workers" -lt 1 ]; then workers=1; fi
          echo "LEAN_NUM_THREADS=${workers}" >> "$GITHUB_ENV"
          echo "Lean will use ${workers} thread(s) on ${cpus} runner CPU(s)."

      # The dependency declaration pins Mathlib by exact commit, so this cache
      # identity changes whenever the Lean toolchain or dependency declaration
      # changes. On a warm hit Lake can reuse both dependency sources and the
      # Mathlib build artifacts instead of recloning and redownloading thousands
      # of cached proof objects on every PR head.
      - name: Restore Lean dependency/build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/packages
            lake-manifest.json
          key: cosmo-lean-deps-v1-${{ runner.os }}-lean-4.33.1-${{ hashFiles('lean-toolchain', 'lakefile.lean') }}

      - name: Build pinned Lake project
        run: lake build

      - name: Reject admitted proofs, custom axioms, and native_decide
        run: ./scripts/check-lean-trust.sh

      - name: Audit theorem axiom dependencies
        shell: bash
        run: |
          lake env lean audit/AxiomAudit.lean | tee axiom-report.txt
          python3 - <<'PY'
          import re
          from pathlib import Path

          allowed = {"propext", "Classical.choice", "Quot.sound"}
          unexpected: list[tuple[str, list[str]]] = []

          for line in Path("axiom-report.txt").read_text(encoding="utf-8").splitlines():
              match = re.search(r"depends on axioms: \[(.*)\]$", line)
              if match is None:
                  continue
              dependencies = [item.strip() for item in match.group(1).split(",") if item.strip()]
              bad = [item for item in dependencies if item not in allowed]
              if bad:
                  unexpected.append((line, bad))

          if unexpected:
              for line, bad in unexpected:
                  print(f"ERROR: unexpected Lean axiom dependency {bad}: {line}")
              raise SystemExit(1)
          PY

  python:
    name: Python deterministic core
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development checks
        run: python -m pip install -r requirements-dev.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Static type check
        run: mypy --strict cosmovirus.py tests/test_cosmovirus.py

      - name: Bytecode compile check
        run: python -m compileall -q cosmovirus.py tests
