name: COSMO CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cosmo-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  TZ: UTC
  PYTHONHASHSEED: "0"
  COSMO_BUILD_WORKSPACE: /tmp/cosmo-build-workspace
  COSMO_AUDIT_WORKSPACE: /tmp/cosmo-audit-workspace
  LEAN_VERSION: "4.33.1"
  LEAN_LINUX_SHA256: "890afd185370f85666025b883914ab4f4b339136f8c96167b69cfb62aecaf235"
  EXPECTED_LEAN_TOOLCHAIN_SHA256: "3aac669c7a910ec2389f4e4f921b605adf6ebf2d1e0c9b9cd0be4d33f3f5db71"
  EXPECTED_LAKE_MANIFEST_SHA256: "da84374efd9e7a24d40bbd0273c55409f1957fe121b6a795d3d5776381edc86e"
  MATHLIB_COMMIT: "0df444a360eaa60ab8c11dca51a86af692955474"

jobs:
  lean:
    name: Lean 4 formal integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Verify reviewed OPT dependency anchor
        id: anchor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib
          import json
          from pathlib import Path

          anchor = json.loads(Path("audit/lean-dependency-anchor.json").read_text())
          if anchor.get("schema") != "COSMO-OPT-LEAN-ANCHOR-1":
              raise SystemExit("invalid COSMO Lean dependency anchor schema")
          if anchor.get("lean_version") != "4.33.1":
              raise SystemExit("Lean anchor version mismatch")
          if anchor.get("lean_linux_archive_sha256") != "890afd185370f85666025b883914ab4f4b339136f8c96167b69cfb62aecaf235":
              raise SystemExit("Lean archive anchor mismatch")
          if anchor.get("lake_manifest_sha256") != "da84374efd9e7a24d40bbd0273c55409f1957fe121b6a795d3d5776381edc86e":
              raise SystemExit("Lake manifest anchor mismatch")
          if anchor.get("mathlib_commit") != "0df444a360eaa60ab8c11dca51a86af692955474":
              raise SystemExit("Mathlib anchor mismatch")
          toolchain_sha = hashlib.sha256(Path("lean-toolchain").read_bytes()).hexdigest()
          if toolchain_sha != anchor.get("lean_toolchain_sha256"):
              raise SystemExit("lean-toolchain bytes do not match reviewed anchor")
          lakefile_sha = hashlib.sha256(Path("lakefile.lean").read_bytes()).hexdigest()
          source_key = (
              f"{anchor['source_cache_schema']}-{__import__('os').environ['RUNNER_OS']}-x86_64-"
              f"lean-{anchor['lean_version']}-{anchor['lean_linux_archive_sha256']}-"
              f"{toolchain_sha}-{lakefile_sha}-{anchor['lake_manifest_sha256']}"
          )
          build_key = (
              f"{anchor['build_cache_schema']}-{__import__('os').environ['RUNNER_OS']}-x86_64-"
              f"lean-{anchor['lean_version']}-{anchor['lean_linux_archive_sha256']}-"
              f"{anchor['lake_manifest_sha256']}-{anchor['artifact_count']}-{anchor['canonical_sha256']}"
          )
          print(f"source_key={source_key}")
          print(f"build_key={build_key}")
          print(f"artifact_count={anchor['artifact_count']}")
          print(f"canonical_sha256={anchor['canonical_sha256']}")
          PY

      - name: Install hash-pinned Lean distribution
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          echo "${EXPECTED_LEAN_TOOLCHAIN_SHA256}  lean-toolchain" | sha256sum --check --strict
          archive="$RUNNER_TEMP/lean-${LEAN_VERSION}-linux.tar.zst"
          url="https://github.com/leanprover/lean4/releases/download/v${LEAN_VERSION}/lean-${LEAN_VERSION}-linux.tar.zst"
          curl --fail --location --proto '=https' --tlsv1.2 "$url" --output "$archive"
          echo "${LEAN_LINUX_SHA256}  ${archive}" | sha256sum --check --strict
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP"
          lean_home="$RUNNER_TEMP/lean-${LEAN_VERSION}-linux"
          test -x "$lean_home/bin/lean"
          test -x "$lean_home/bin/lake"
          test -x "$lean_home/bin/leanchecker"
          echo "$lean_home/bin" >> "$GITHUB_PATH"
          echo "PINNED_LEAN_HOME=$lean_home" >> "$GITHUB_ENV"
          "$lean_home/bin/lean" --version
          "$lean_home/bin/lake" --version

      - name: Configure bounded Lean parallelism
        shell: bash
        run: |
          set -euo pipefail
          cpus="$(nproc)"
          workers="$cpus"
          if [ "$workers" -gt 4 ]; then workers=4; fi
          if [ "$workers" -lt 1 ]; then workers=1; fi
          echo "LEAN_NUM_THREADS=${workers}" >> "$GITHUB_ENV"
          echo "Lean will use ${workers} thread(s) on ${cpus} runner CPU(s)."

      - name: Materialize isolated build workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$COSMO_BUILD_WORKSPACE" "$COSMO_AUDIT_WORKSPACE"
          mkdir -p "$COSMO_BUILD_WORKSPACE"
          git archive --format=tar HEAD | tar -xf - -C "$COSMO_BUILD_WORKSPACE"
          mkdir -p "$COSMO_BUILD_WORKSPACE/.lean-cache"

      - name: Restore verified dependency source state
        id: source-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            /tmp/cosmo-build-workspace/.lake/packages
            /tmp/cosmo-build-workspace/lake-manifest.json
            /tmp/cosmo-build-workspace/.lean-cache/source-receipt.json
          key: ${{ steps.anchor.outputs.source_key }}

      - name: Resolve and verify dependency source cache miss
        if: steps.source-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$COSMO_BUILD_WORKSPACE"
          rm -f lake-manifest.json
          rm -rf .lake/packages
          MATHLIB_NO_CACHE_ON_UPDATE=1 "$PINNED_LEAN_HOME/bin/lake" update
          for pkg in .lake/packages/*; do
            [ -d "$pkg" ] || continue
            rm -rf "$pkg/.lake"
          done
          python3 "$GITHUB_WORKSPACE/scripts/verify-lean-source-state.py" \
            --root .lake/packages \
            --lake-manifest lake-manifest.json \
            --expected-manifest-sha256 "$EXPECTED_LAKE_MANIFEST_SHA256" \
            --dependency-declaration lakefile.lean \
            --receipt .lean-cache/source-receipt.json \
            --write-receipt

      - name: Verify restored dependency source cache hit
        if: steps.source-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          packages="$COSMO_BUILD_WORKSPACE/.lake/packages"
          sudo chmod -R u+rwX "$packages" "$COSMO_BUILD_WORKSPACE/.lean-cache"
          for pkg in "$packages"/*; do
            [ -d "$pkg" ] || continue
            sudo rm -rf "$pkg/.lake"
          done
          sudo python3 "$GITHUB_WORKSPACE/scripts/verify-lean-source-state.py" \
            --root "$packages" \
            --lake-manifest "$COSMO_BUILD_WORKSPACE/lake-manifest.json" \
            --expected-manifest-sha256 "$EXPECTED_LAKE_MANIFEST_SHA256" \
            --dependency-declaration "$COSMO_BUILD_WORKSPACE/lakefile.lean" \
            --receipt "$COSMO_BUILD_WORKSPACE/.lean-cache/source-receipt.json"

      - name: Save verified dependency source state
        if: steps.source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            /tmp/cosmo-build-workspace/.lake/packages
            /tmp/cosmo-build-workspace/lake-manifest.json
            /tmp/cosmo-build-workspace/.lean-cache/source-receipt.json
          key: ${{ steps.anchor.outputs.source_key }}

      - name: Freeze verified dependency source and create build-cache slots
        shell: bash
        run: |
          set -euo pipefail
          sudo chown -R root:root "$COSMO_BUILD_WORKSPACE"
          sudo chmod -R a+rX "$COSMO_BUILD_WORKSPACE"
          sudo chmod -R a-w "$COSMO_BUILD_WORKSPACE"

          # Only generated Lake state is writable while build artifacts are
          # restored/materialized. Verified source bytes and Git metadata stay
          # root-owned and read-only.
          sudo install -d -o runner -g docker -m 0755 "$COSMO_BUILD_WORKSPACE/.lake/config"
          for pkg in "$COSMO_BUILD_WORKSPACE"/.lake/packages/*; do
            [ -d "$pkg" ] || continue
            sudo install -d -o runner -g docker -m 0755 "$pkg/.lake/build"
          done

      - name: Restore reviewed dependency build artifacts
        id: build-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: /tmp/cosmo-build-workspace/.lake/packages/*/.lake/build
          key: ${{ steps.anchor.outputs.build_key }}

      - name: Materialize first reviewed build-artifact cache
        if: steps.build-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$COSMO_BUILD_WORKSPACE"
          env -u MATHLIB_NO_CACHE_ON_UPDATE \
            "$PINNED_LEAN_HOME/bin/lake" exe cache get
          python3 "$GITHUB_WORKSPACE/scripts/verify-lean-dependency-artifacts.py" verify-anchor \
            --root .lake/packages \
            --anchor "$GITHUB_WORKSPACE/audit/lean-dependency-anchor.json"

      - name: Verify reviewed build-artifact cache hit
        if: steps.build-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-lean-dependency-artifacts.py verify-anchor \
            --root "$COSMO_BUILD_WORKSPACE/.lake/packages" \
            --anchor audit/lean-dependency-anchor.json

      - name: Save reviewed dependency build artifacts
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: /tmp/cosmo-build-workspace/.lake/packages/*/.lake/build
          key: ${{ steps.anchor.outputs.build_key }}

      - name: Freeze authenticated dependency state
        shell: bash
        run: |
          set -euo pipefail
          sudo chown -R root:root "$COSMO_BUILD_WORKSPACE/.lake/packages"
          sudo chmod -R a+rX "$COSMO_BUILD_WORKSPACE/.lake/packages"
          sudo chmod -R a-w "$COSMO_BUILD_WORKSPACE/.lake/packages"
          sudo chown root:root "$COSMO_BUILD_WORKSPACE/lake-manifest.json" \
            "$COSMO_BUILD_WORKSPACE/.lean-cache/source-receipt.json"
          sudo chmod 0444 "$COSMO_BUILD_WORKSPACE/lake-manifest.json" \
            "$COSMO_BUILD_WORKSPACE/.lean-cache/source-receipt.json"

      - name: Run OPT-LEAN-001 protected verified-reuse pipeline
        shell: bash
        env:
          COSMO_DEPENDENCY_ANCHOR: ${{ github.workspace }}/audit/lean-dependency-anchor.json
        run: bash scripts/run-lean-verified-reuse-ci.sh

      - name: Record routine verified-reuse evidence
        if: always()
        shell: bash
        run: |
          {
            echo "### COSMO OPT-LEAN-001 routine lane"
            echo "- Source cache hit: \`${{ steps.source-cache.outputs.cache-hit == 'true' }}\`"
            echo "- Build cache hit: \`${{ steps.build-cache.outputs.cache-hit == 'true' }}\`"
            echo "- Dependency artifact count anchor: \`${{ steps.anchor.outputs.artifact_count }}\`"
            echo "- Canonical dependency SHA-256: \`${{ steps.anchor.outputs.canonical_sha256 }}\`"
            echo "- Current COSMO modules: rebuilt from reviewed source"
            echo "- Authority: verified reuse, not cold reconstruction"
          } >> "$GITHUB_STEP_SUMMARY"

  python:
    name: Python deterministic core
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development checks
        run: python -m pip install -r requirements-dev.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Static type check
        run: mypy --strict cosmovirus.py tests/test_cosmovirus.py

      - name: Bytecode compile check
        run: python -m compileall -q cosmovirus.py tests
