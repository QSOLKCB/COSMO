name: COSMO CI

on:
  # PR branches are validated by the pull_request event. Restrict push CI to
  # main so each PR commit does not consume a second, duplicate workflow run.
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer commit to the same PR supersedes the older validation run. This keeps
# CI focused on the head that can actually be merged while preserving main runs.
concurrency:
  group: cosmo-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  TZ: UTC
  PYTHONHASHSEED: "0"

jobs:
  lean:
    name: Lean 4 formal integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # COSMO's current integrity checks do not depend on Git history.
          # Keep the checkout shallow unless a future provenance check requires
          # the QEC-style fetch-depth: 0 contract explicitly.
          fetch-depth: 1

      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Port the bounded-parallelism policy used by QSOL-GEO-REASON. Hosted
      # runners vary in CPU count, so cap at four rather than oversubscribing.
      - name: Configure bounded Lean parallelism
        shell: bash
        run: |
          set -euo pipefail
          cpus="$(nproc)"
          workers="$cpus"
          if [ "$workers" -gt 4 ]; then workers=4; fi
          if [ "$workers" -lt 1 ]; then workers=1; fi
          echo "LEAN_NUM_THREADS=${workers}" >> "$GITHUB_ENV"
          echo "Lean will use ${workers} thread(s) on ${cpus} runner CPU(s)."

      # The dependency declaration pins Mathlib by exact commit, so this cache
      # identity changes whenever the Lean toolchain or dependency declaration
      # changes. On a warm hit Lake can reuse both dependency sources and the
      # Mathlib build artifacts instead of recloning and redownloading thousands
      # of cached proof objects on every PR head.
      - name: Restore Lean dependency/build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/packages
            lake-manifest.json
          key: cosmo-lean-deps-v1-${{ runner.os }}-lean-4.33.1-${{ hashFiles('lean-toolchain', 'lakefile.lean') }}

      - name: Build pinned Lake project
        run: lake build

      - name: Reject admitted proofs, custom declarations, and native_decide lexically
        run: ./scripts/check-lean-trust.sh

      - name: Audit every COSMO declaration semantically
        shell: bash
        run: lake env lean audit/AxiomAudit.lean | tee axiom-report.txt

      - name: Regression-test generated axiom rejection
        shell: bash
        run: |
          set -euo pipefail
          temporary="$(mktemp -d)"
          fixture="$temporary/GeneratedAxiomFixture.lean"
          report="$temporary/generated-axiom-report.txt"
          trap 'rm -rf "$temporary"' EXIT

          cat > "$fixture" <<'LEAN'
          import CosmoTrust

          open Lean Elab Command

          run_cmd do
            addDecl <| Declaration.axiomDecl {
              name := `CosmoTrustFixture.generatedBogus
              levelParams := []
              type := mkConst ``False
              isUnsafe := false
            }

          run_cmd do
            CosmoTrust.auditNamedDeclarations
              "generated declaration regression fixture"
              #[`CosmoTrustFixture.generatedBogus]
          LEAN

          if lake env lean "$fixture" >"$report" 2>&1; then
            cat "$report"
            echo "ERROR: semantic trust audit accepted a generated axiom declaration."
            exit 1
          fi

          cat "$report"
          grep -F "project-generated axiom declaration" "$report" >/dev/null

  python:
    name: Python deterministic core
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development checks
        run: python -m pip install -r requirements-dev.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Static type check
        run: mypy --strict cosmovirus.py tests/test_cosmovirus.py

      - name: Bytecode compile check
        run: python -m compileall -q cosmovirus.py tests
